<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abfahrten</title>
<style>
  /* ======================================================
     CUSTOMIZE HERE
     ====================================================== */
  :root{
    --stop-name-text: "Weimar, Abzweig nach Niedergrunstedt";
    --stop-name-color:#ffb84d;
    --stop-name-size:34px;
    --stop-header-bg:#1a1f29;

    --page-bg:#12151d;

    --table-header-bg:#12151d;
    --table-header-color:#8d96a8;
    --table-header-size:14px;
    --table-header-en-size:11px;

    --row-text-color:#eef1f6;
    --row-text-size:19px;

    --divider-color:#4a5164;
    --max-departures:8;
  }
  /* ====================================================== */

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page-bg);
    font-family:'Courier New',ui-monospace,monospace;
    min-height:100vh;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:0 0 48px;
  }
  .stop-header{
    background:var(--stop-header-bg);
    padding:24px 20px;
  }
  h1{
    color:var(--stop-name-color);
    font-size:var(--stop-name-size);
    font-weight:700;
    margin:0;
  }
  .table-wrap{
    padding:0 20px;
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  thead tr{
    background:var(--table-header-bg);
  }
  thead th{
    text-align:left;
    font-weight:400;
    color:var(--table-header-color);
    font-size:var(--table-header-size);
    padding:16px 0 12px;
    border-bottom:2px solid var(--divider-color);
  }
  thead th .en{
    display:block;
    font-style:italic;
    font-size:var(--table-header-en-size);
    margin-top:2px;
  }
  thead th.col-abfahrt{ text-align:right; }
  tbody td{
    color:var(--row-text-color);
    font-size:var(--row-text-size);
    padding:10px 0;
    white-space:nowrap;
  }
  tbody td.col-abfahrt{ text-align:right; }
  tbody td.col-nach{
    width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    padding-right:16px;
  }
  tbody td.col-linie{
    padding-right:16px;
    font-weight:700;
  }
  .empty-msg{
    color:var(--table-header-color);
    font-style:italic;
    padding:12px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stop-header">
    <h1 id="stop-name"></h1>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-linie">Linie<span class="en">Line</span></th>
          <th class="col-nach">Nach<span class="en">To</span></th>
          <th class="col-abfahrt">Abfahrt<span class="en">Departure</span></th>
        </tr>
      </thead>
      <tbody id="dep-body"></tbody>
    </table>
  </div>
</div>

<script>
const DATA_URL = 'data.json';
const RELOAD_MS = 10 * 60 * 1000;

function pad(n){ return n.toString().padStart(2, '0'); }
function todayISO(d = new Date()){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function isoToGtfsDate(iso){ return iso.replaceAll('-', ''); }
const WEEKDAY_KEYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];

function activeServiceIds(DATA, iso){
  const gdate = isoToGtfsDate(iso);
  const jsDay = new Date(iso + 'T12:00:00').getDay();
  const dayKey = WEEKDAY_KEYS[jsDay];
  const active = new Set();
  for (const [sid, cal] of Object.entries(DATA.calendars)){
    if (cal[dayKey] === 1 && gdate >= cal.start_date && gdate <= cal.end_date) active.add(sid);
  }
  for (const [sid, exceptions] of Object.entries(DATA.calendar_exceptions)){
    for (const ex of exceptions){
      if (ex.date !== gdate) continue;
      if (ex.exception_type === 1) active.add(sid);
      if (ex.exception_type === 2) active.delete(sid);
    }
  }
  return active;
}

function getMaxDepartures(){
  const v = getComputedStyle(document.documentElement).getPropertyValue('--max-departures').trim();
  return parseInt(v, 10) || 8;
}

async function render(){
  const stopNameEl = document.getElementById('stop-name');
  const body = document.getElementById('dep-body');

  let DATA;
  try{
    const res = await fetch(DATA_URL, {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
  } catch(err){
    stopNameEl.textContent = 'Keine Daten verfügbar';
    body.innerHTML = `<tr><td colspan="3" class="empty-msg">Fahrplandaten konnten nicht geladen werden (${err.message}).</td></tr>`;
    return;
  }

  const configuredName = getComputedStyle(document.documentElement).getPropertyValue('--stop-name-text').trim().replace(/^"|"$/g, '');
  stopNameEl.textContent = configuredName || DATA.stop_group_name || 'Haltestelle';

  const now = new Date();
  const iso = todayISO(now);
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  const stopIds = Object.keys(DATA.stop_labels);

  const activeToday = activeServiceIds(DATA, iso);
  const yesterday = new Date(now); yesterday.setDate(yesterday.getDate()-1);
  const activeYesterday = activeServiceIds(DATA, todayISO(yesterday));

  const upcoming = [];
  for (const dep of DATA.departures){
    if (!stopIds.includes(dep.stop_id)) continue;
    const [hStr, mStr] = dep.departure_time.split(':');
    const h = parseInt(hStr, 10), m = parseInt(mStr, 10);

    if (activeToday.has(dep.service_id)){
      const minsFromNow = (h*60 + m) - nowMinutes;
      if (minsFromNow >= -1) upcoming.push({dep, minsFromNow, displayTime: `${pad(h % 24)}:${pad(m)}`});
    }
    if (h >= 24 && activeYesterday.has(dep.service_id)){
      const minsFromNow = ((h-24)*60 + m) - nowMinutes;
      if (minsFromNow >= -1) upcoming.push({dep, minsFromNow, displayTime: `${pad(h % 24)}:${pad(m)}`});
    }
  }

  upcoming.sort((a,b) => a.minsFromNow - b.minsFromNow);
  const next = upcoming.slice(0, getMaxDepartures());

  if (next.length === 0){
    body.innerHTML = '<tr><td colspan="3" class="empty-msg">Keine weiteren Abfahrten heute.</td></tr>';
    return;
  }

  body.innerHTML = next.map(({dep, displayTime}) => `
    <tr>
      <td class="col-linie">${dep.route_short_name || '—'}</td>
      <td class="col-nach">${dep.trip_headsign || ''}</td>
      <td class="col-abfahrt">${displayTime}</td>
    </tr>
  `).join('');
}

render();
setInterval(render, 30000);
setTimeout(() => location.reload(), RELOAD_MS);
</script>
</body>
</html>
