name: Update dashboard screenshot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Render live dashboard screenshot
        run: |
          python3 scripts/screenshot.py

      - name: Commit updated screenshot
        run: |
          git config user.name "vmt-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/latest.png

          if git diff --cached --quiet; then
            echo "No changes to docs/latest.png"
          else
            git commit -m "Update dashboard screenshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
