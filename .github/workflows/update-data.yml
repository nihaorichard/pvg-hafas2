name: Update VMT timetable data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs/data.json from the VMT GTFS feed
        run: python3 scripts/build_data.py

      - name: Commit updated data if it changed
        run: |
          git config user.name "vmt-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "No changes to docs/data.json"
          else
            git commit -m "Update timetable data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
